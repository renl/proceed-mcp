name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.2
      - shell: bash
        run: |
          node --version
      - shell: bash
        run: |
          npm ci --ignore-scripts
      - shell: bash
        run: |
          node node_modules/prettier/bin/prettier.cjs --check .github/workflows/ci.yml
      - shell: bash
        run: |
          node --test --test-reporter=tap tests/harness-question-lifetime.test.mjs tests/harness-revocation-unit.test.mjs tests/harness-channel-unit.test.mjs tests/harness-context-unit.test.mjs tests/harness-preparation-unit.test.mjs tests/harness-admission-unit.test.mjs
        timeout-minutes: 1
      - shell: bash
        run: |
          node --test --test-reporter=tap tests/portable-execution-cancel.test.mjs tests/portable-wait-unit.test.mjs
        timeout-minutes: 1
      - shell: bash
        run: |
          node --experimental-test-module-mocks --test tests/startup-token-environment.test.mjs
        timeout-minutes: 1
      - shell: bash
        run: |
          node --experimental-vm-modules --test tests/startup-token-helper-environment.test.mjs
        timeout-minutes: 1
      - shell: bash
        run: |
          node --experimental-test-module-mocks --test tests/windows-storage-node-unit.test.mjs
        timeout-minutes: 1
